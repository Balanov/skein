name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Race detector
        run: CGO_ENABLED=1 go test -race -count=1 ./...

  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: Compile ${{ matrix.goos }}/${{ matrix.goarch }}
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath ./cmd/skein ./cmd/skein-bench

  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build

  runtime-proof:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest }
          - { runner: ubuntu-24.04-arm }
          - { runner: windows-latest }
          - { runner: windows-11-arm }
          - { runner: macos-15-intel }
          - { runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Skein
        shell: bash
        run: |
          mkdir -p bin
          if [ "${{ runner.os }}" = "Windows" ]; then output=bin/skein.exe; else output=bin/skein; fi
          go build -trimpath -o "$output" ./cmd/skein
          echo "SKEIN_BIN=$output" >> "$GITHUB_ENV"
      - name: Functional CLI proof
        shell: bash
        run: python bench/functional_proof.py --skein "$SKEIN_BIN" --output "bench/results/ci-functional-${{ matrix.runner }}.json"
      - name: Parent/child stop proof
        shell: bash
        run: python bench/stop_proof.py --skein "$SKEIN_BIN" --runs 3 --warmups 1 --tasks 4 --output "bench/results/ci-stop-${{ matrix.runner }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-proof-${{ matrix.runner }}
          path: bench/results/ci-*.json
          if-no-files-found: error
